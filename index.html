<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
    <aside class="sidebar">
        <h2>Moods</h2>
        <button class="mood-btn" data-mood="happy">
            Happy
        </button>
        <button class="mood-btn" data-mood="stressed">
            Stressed
        </button>
        <button class="mood-btn" data-mood="sleepy">
            Sleepy
        </button>
        <button class="mood-btn" data-mood="creative">
            Creative
        </button>
        <button class="mood-btn" data-mood="productive">
            Productive
        </button>
    </aside>
    <div class="recommendations">
    <h3>Current Mood</h3>
    <p id="lighting">Lighting</p>
    <p id="music">Music</p>
    <p id="drink">Drink</p>
    <p id="scent">Scent</p>
</div>
<div class="room-container">
    <div class="room">
        <img src="assets/room/room-background.png"
             class="layer background">
        <img src="assets/room/window.png"
             class="layer window">
        <img src="assets/room/curtains.png"
             class="layer curtains">
<img src="assets/furniture/bed.png" class="layer bed">
<img src="assets/furniture/rug.png" class="layer rug">
<img src="assets/furniture/desk.png" class="layer desk">
<img src="assets/furniture/chair.png" class="layer chair">
<img src="assets/furniture/lamp.png" class="layer lamp">
<img src="assets/furniture/plant.png" class="layer plant">
    </div>
</div>
</div>
<script src="script.js"></script>
</body>
