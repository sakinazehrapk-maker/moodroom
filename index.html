<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mood-bar">
    <button class="mood-btn" data-mood="happy">Happy</button>
    <button class="mood-btn" data-mood="stressed">Stressed</button>
    <button class="mood-btn" data-mood="sleepy">Sleepy</button>
    <button class="mood-btn" data-mood="creative">Creative</button>
    <button class="mood-btn" data-mood="productive">Productive</button>
</div>
<div class="app">
    <div class="wellness-card">
    <h2>Wellness Hub</h2>
    <div class="checklist-section">
        <h3>Self-Care Checklist</h3>
        <ul id="checklist"></ul>
    </div>
    <div class="divider"></div>
    <div class="history-section">
        <h3>Mood History</h3>
        <div id="historyList">
            <p>No moods recorded yet.</p>
        </div>
    </div>
</div>
    <div class="left-panel">
    <div class="recommendations">
        <h3>Current Mood</h3>
        <p id="lighting">Lighting</p>
        <p id="music">Music</p>
        <p id="drink">Drink</p>
        <p id="scent">Scent</p>
    </div>
    <div class="music-card">
        <h3>Now Playing</h3>
        <p id="songName">Nothing Playing</p>
        <button id="toggleMusic">▶ Play</button>
    </div>
</div>
<div class="room-container">
    <div class="room">
        <div id="lightingOverlay"></div>
<img id="wallpaper" src="assets/room/room-background.png" class="layer wallpaper">
<img id="window" src="assets/weather/sunny.png" class="layer window">
<img id="bed" src="assets/furniture/bed.png" class="layer bed">
<img id="desk" src="assets/furniture/desk.png" class="layer desk">
<img id="plant" src="assets/furniture/plant.png" class="layer plant">
<img id="lamp" src="assets/furniture/lamp.png" class="layer lamp">
<img id="drinkImg" src="assets/drinks/coffee.png" class="layer drink">
<img src="assets/furniture/rug.png" class="layer rug">
<img src="assets/furniture/chair.png" class="layer chair">
<img id="decor1" class="layer decor">
    </div>
</div>
</div>
<audio id="bgMusic" loop></audio>
<script src="script.js"></script>
</body>
